  <head>
    <meta charset="UTF-8" />

    <!-- Primary SEO — truthful, 7,900+ palettes -->
    <title>PaletteLab — Free Color Palette Generator, Photo Extractor & WCAG Tools</title>
    <meta name="description" content="Discover 7,900+ original color palettes, extract colors from any photo, generate harmonic schemes with the spacebar, and check WCAG contrast — all free, all mathematically generated." />
    <meta name="keywords" content="color palettes, color schemes, hex codes, color generator, extract colors from image, pastel palette, neon colors, color wheel, WCAG contrast checker" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />
    <meta name="author" content="PaletteLab" />
    <link rel="canonical" href="https://palettelab.in/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://palettelab.in/" />
    <meta property="og:title" content="PaletteLab — Free Color Palettes & Design Tools for Creators" />
    <meta property="og:description" content="7,900+ original palettes, photo color extractor, harmonic generator, and WCAG checker. 100% original, mathematically generated." />
    <meta property="og:site_name" content="PaletteLab" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="Explore thousands of original color palettes, photo extraction, and hex tools. Free forever. No scraping." />

    <!-- JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "name": "PaletteLab",
          "url": "https://palettelab.in/",
          "applicationCategory": "DesignApplication",
          "operatingSystem": "All",
          "browserRequirements": "Requires JavaScript. Requires HTML5.",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          },
          "description": "Free color palette generator, photo color extractor, and hex code tools with WCAG accessibility checker. 100% original palettes."
        },
        {
          "@type": "WebSite",
          "name": "PaletteLab",
          "url": "https://palettelab.in/",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://palettelab.in/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is the 60-30-10 color rule in UI and Interior Design?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "The 60-30-10 rule is a classic design balance principle: 60% dominant canvas color, 30% supporting secondary structure color, and 10% high-contrast accent for action buttons and badges."
              }
            },
            {
              "@type": "Question",
              "name": "How do you create harmonious color schemes?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Color harmonies utilize mathematical angles on the 360° color wheel, including Complementary (180°), Analogous (30°), Triadic (120°), and Monochromatic lightness scales."
              }
            },
            {
              "@type": "Question",
              "name": "What are WCAG AA and AAA color contrast requirements?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "WCAG 2.1 requires a minimum contrast ratio of 4.5:1 for standard text (Level AA) and 7.0:1 (Level AAA) to ensure full accessibility."
              }
            }
          ]
        }
      ]
    }
    </script>

  </head>
